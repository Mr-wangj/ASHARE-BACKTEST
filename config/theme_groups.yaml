# 涨停原因题材归类表
#
# 同花顺的“涨停原因类别”是自由标签（如 AI漫剧、AI短剧、微短剧），名字不统一。这里按关键词把它们归并成大类：
# - 一个标签只要包含某一类的任一关键词，就归到这一类；
# - 按文件从上到下的顺序匹配，先匹配到的类优先（所以更具体的类要放在前面，例如 光伏 要放在 锂电 前面，
#   这样“钙钛矿电池”归光伏而不是锂电）；
# - kind：题材 = 行业/概念，参与配色和“主题材”判断；事件 = 业绩、国资、重组等，只有没有任何题材标签时才作为主题材；
# - 没匹配到任何关键词的标签保持原名，单独成一类。
# 改完保存后刷新看板页面即可生效（不用重跑回测）。

groups:
  # ---------------- 题材（顺序即优先级）
