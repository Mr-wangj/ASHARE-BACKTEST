# 消息定义：哪些消息会影响股价、影响多大。看板「舆情监控」的消息监控、涨停原因分析、明日题材预判都按这里计算。
# 修改后保存，刷新页面即生效（每日自动更新时也会按最新规则重算当天的预判）。
#
# categories：盘后消息（同花顺 7×24 快讯）的类别，从上到下匹配
#   keywords  标题或摘要包含任一关键词即命中（英文不区分大小写）；一条消息可命中多个类别，按权重绝对值最大的计分
#   exclude   可选：包含任一排除词的消息不算这一类（如“股东大会”不算会议展会）
#   weight    对题材的催化强度：正数利好、负数利空；“盘后催化分”= 题材下各条消息权重之和（取对数压缩）
#   kind      利好 / 利空 / 中性，只用于显示
# reason_sources：涨停原因里“据……”的来源分类（静态分析：公告、互动易、研报、政策、媒体、传闻大V），从上到下匹配

catalyst_beta: 0.5      # 综合分 = 基础概率的对数几率 + catalyst_beta × 盘后催化分
important_boost: 1.5    # 同花顺标为“重要”的快讯，权重乘以该系数
calendar_weight: 2.0    # 事件日历里明日（下一交易日）的事件，每条给关联题材加的分；之后 3 天内减半
hot_new_weight: 1.0     # 问财热门概念“首次上榜”加分
popularity_weight: 0.2  # 人气榜前 100 每有一只该题材的股票加分
company_factor: 0.3     # 个股公告类消息（同花顺标“公告”，或“某公司：……”只关联一只股票）对题材的催化折算
baseline_days: 10       # 题材消息的“常态”：前 N 个交易日的盘后消息份额；催化分只看高出常态的部分

# 行情复盘类消息（标题含任一词）：复述当天的涨跌，不算新催化，只在消息列表里显示、不计分
ignore_titles: [收评, 午评, 早评, 收盘, 午盘, 开盘, 异动, 龙虎榜, 复盘, 资金流向, 南向资金, 北向资金, 净买入, 净卖出,
                指数日报, 涨幅居前, 跌幅居前, 拉升, 跳水, 涨停潮, 跌停潮]

# 新闻里太常见、按题材归类会误判的词（只影响快讯→题材的映射，不影响涨停原因标签的归类）。
# 例如“数据显示”会被“显示”归到消费电子，“XX证券”会被归到金融。
theme_stopwords: [显示, 能源, 新能源, 发电, 证券, 期货, 银行, 金融, 支付, 保险, 药, 生物, 设备, 装备, 机械, 消费,
                  工程, 设计, 建筑, 矿, 运输, 交通, 材料, 出口, 海外, 外贸, 外销]

